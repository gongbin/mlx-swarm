[project]
name = "mlx-swarm"
version = "0.0.1"
description = "Distributed LLM inference across Apple Silicon Macs on MLX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # P 组内所有节点必须使用完全相同的版本
    "mlx==0.32.1",
    "mlx-lm==0.31.3",
]

[tool.setuptools.packages.find]
include = ["swarm*"]

[dependency-groups]
dev = ["pytest>=9.0"]
