[project]
name = "mlx-swarm"
version = "0.0.1"
description = "Distributed LLM inference across Apple Silicon Macs on MLX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # P 组内所有节点必须使用完全相同的版本
    "mlx==0.32.1",
    "mlx-lm==0.31.3",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.32",
]

[project.scripts]
swarm = "swarm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swarm*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = ["pytest>=9.0"]
